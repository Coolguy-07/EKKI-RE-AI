<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKKI-RE-AI</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Application Header -->
    <header class="app-header">
        <div class="header-container">
            <h1 class="app-title">EKKI-RE-AI</h1>
            <span class="status-badge" id="status-badge" aria-live="polite">Ready</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-main">
        <!-- Chat History Container -->
        <section class="chat-container" id="chat-container" aria-label="Chat Messages History">
            <div class="messages-list" id="messages-list" role="log" aria-live="polite" aria-relevant="additions">
                <!-- Chat messages will be dynamically injected here via JavaScript -->
            </div>
        </section>

        <!-- Prompt Input Form -->
        <section class="input-section" aria-label="Prompt Input Section">
            <form id="chat-form" class="chat-form">
                <div class="input-wrapper">
                    <label for="prompt-input" class="visually-hidden">Enter your prompt</label>
                    <textarea 
                        id="prompt-input" 
                        name="prompt" 
                        class="prompt-input" 
                        placeholder="Type your message here..." 
                        rows="1" 
                        required 
                        aria-required="true"
                    ></textarea>
                    <button type="submit" id="send-button" class="send-button" aria-label="Send prompt">
                        <span class="button-text">Send</span>
                    </button>
                </div>
            </form>
        </section>
    </main>

    <!-- Application Footer -->
    <footer class="app-footer">
        <p class="footer-info">Local AI • Ollama • Qwen3</p>
    </footer>

</body>
</html>
